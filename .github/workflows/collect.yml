name: 收集 YouBike 資料

# 每次執行會連續工作約 5.5 小時，每 10 分鐘：
#   收資料與雨量 → （需要時）自動重訓模型 → 預測並更新 predictions.xlsx → 有缺車就通知
# 結束前自動啟動下一輪，像接力一樣不中斷（不依賴 GitHub 排程，排程常延遲或被跳過）。
on:
  workflow_dispatch:          # 第一次手動按 Run workflow 啟動接力
  schedule:
    - cron: "17 */6 * * *"    # 備援：萬一接力斷掉，每 6 小時嘗試重新啟動

permissions:
  contents: write             # 存資料、模型、預測檔
  actions: write              # 啟動下一輪

concurrency:
  group: collect
  cancel-in-progress: false   # 同時只會有一輪在跑

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Taipei                              # 用台灣時間記錄
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}      # Power Automate 網址（存在 Secrets）
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}      # 中央氣象署授權碼（存在 Secrets）
      WATCH_KEYWORDS: 中央大學                     # 只通知站名含這些字的站，逗號分隔
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 每 10 分鐘：收資料 → 自動訓練 → 預測 → 通知（連續約 5.5 小時）
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          end=$(( $(date +%s) + 19800 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase || echo "拉取更新失敗，下次再試"
            python collector.py --once --area 中壢區 --daily || echo "這次抓取失敗，10 分鐘後再試"
            python weather.py --once || echo "天氣資料抓取失敗，10 分鐘後再試"
            python train.py --auto || echo "自動訓練失敗，下次再試"
            python notify.py || echo "這次預測或通知失敗，10 分鐘後再試"
            git add -A
            if git commit -q -m "data $(date '+%m/%d %H:%M')"; then
              git pull -q --rebase && git push -q || echo "上傳失敗，下次一起上傳"
            fi
            sleep 600
          done

      - name: 接力：啟動下一輪
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref ${{ github.ref_name }}
