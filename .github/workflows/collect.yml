name: 收集 YouBike 資料

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分鐘（GitHub 忙的時候可能會晚幾分鐘）
  workflow_dispatch:          # 允許手動按「Run workflow」測試

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Taipei         # 用台灣時間記錄
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 抓資料
        run: python collector.py --once --area 中壢區 --daily
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "data $(date '+%m/%d %H:%M')" || exit 0
          git pull --rebase
          git push
